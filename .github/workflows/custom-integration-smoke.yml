# Debug APKs plus a temporary AOT release-mode Chromecast build for cold-start comparisons.
# All are ephemeral test builds, NOT signed Obtainium releases.
name: Custom Android Integration Smoke Build

on:
  push:
    branches:
      - integration/custom-v1-android

permissions:
  contents: read

concurrency:
  group: custom-android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Debug ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Chromecast ARMv7
            platform: android-arm
            suffix: armv7
            mode: debug
          - label: Pixel ARM64
            platform: android-arm64
            suffix: arm64
            mode: debug
          - label: Chromecast ARMv7 optimized AOT
            platform: android-arm
            suffix: armv7-optimized-test
            mode: release
    env:
      PLEZY_CUSTOM_APPLICATION_ID: com.wastingaeons.plezy
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Flutter 3.47.1
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - name: Download locked dependencies
        run: flutter pub get --enforce-lockfile --no-example
      - name: Create disposable release-test signing key (not for production)
        if: matrix.mode == 'release'
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$PWD/android/ephemeral-smoke.jks" \
            -storepass temporary-test-only -keypass temporary-test-only \
            -alias temporary-test -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=Plezy Custom Test, O=Temporary CI"
          cat > android/key.properties <<EOF
          storePassword=temporary-test-only
          keyPassword=temporary-test-only
          keyAlias=temporary-test
          storeFile=$PWD/android/ephemeral-smoke.jks
          EOF
      - name: Compile Android ${{ matrix.mode }} APK
        run: |
          flutter build apk --${{ matrix.mode }} --target-platform "${{ matrix.platform }}" \
            --dart-define=ENABLE_UPDATE_CHECK=false \
            --dart-define=ENABLE_SENTRY=false
      - name: Verify package and provider IDs
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-${{ matrix.mode }}.apk
          test -s "$apk"
          # Discover the installed Android build-tools binary; runner PATH varies.
          aapt=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          test -n "$aapt"
          "$aapt" dump badging "$apk" | grep -F "name='com.wastingaeons.plezy'"
          "$aapt" dump xmltree "$apk" AndroidManifest.xml > manifest-dump.txt
          grep -F 'com.wastingaeons.plezy.fileprovider' manifest-dump.txt
          grep -F 'com.wastingaeons.plezy.systemshelf.artwork' manifest-dump.txt
          if grep -F 'com.edde746.plezy.fileprovider' manifest-dump.txt; then
            echo 'Official Plezy provider authority present in custom APK' >&2
            exit 1
          fi
      - name: Upload test APK (not a production release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plezy-custom-${{ matrix.suffix }}-${{ matrix.mode }}-smoke
          path: build/app/outputs/flutter-apk/app-${{ matrix.mode }}.apk
          retention-days: 5
          if-no-files-found: error

name: Custom Android Integration Smoke Build

on:
  push:
    branches:
      - integration/custom-v1-android

permissions:
  contents: read

jobs:
  android-armv7:
    name: Compile Chromecast ARMv7 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PLEZY_CUSTOM_APPLICATION_ID: com.wastingaeons.plezy
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Flutter 3.47.1
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - name: Download locked dependencies
        run: flutter pub get --enforce-lockfile --no-example
      - name: Verify ARMv7 custom build compiles
        run: |
          flutter build apk --debug --target-platform android-arm \
            --dart-define=ENABLE_UPDATE_CHECK=false \
            --dart-define=ENABLE_SENTRY=false
      - name: Upload smoke APK (not a release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plezy-custom-armv7-debug-smoke
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 5
          if-no-files-found: error

# Temporary development-only formatter: delete this file once PR passes.
# Restricted to a single developer-owned feature branch. No PR-triggered writes.
name: Format feature/tv-persistent-skip-prompt
on:
  push:
    branches:
      - 'feature/tv-persistent-skip-prompt'
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'wastingaeons/plezy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.1'
      - name: Format changed Dart files
        shell: bash
        run: |
          dart format \
            lib/widgets/video_controls/parts/markers.dart \
            lib/widgets/video_controls/parts/visibility.dart \
            lib/widgets/video_controls/video_controls.dart \
            lib/widgets/video_controls/widgets/skip_marker_button.dart \
            test/widgets/video_controls_tv_skip_prompt_test.dart
      - name: Commit formatting (temporary CI-assisted tool)
        shell: bash
        run: |
          set -euo pipefail
          git add -- lib/widgets/video_controls/parts/markers.dart lib/widgets/video_controls/parts/visibility.dart lib/widgets/video_controls/video_controls.dart lib/widgets/video_controls/widgets/skip_marker_button.dart test/widgets/video_controls_tv_skip_prompt_test.dart
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: apply Dart 3.47 formatter to feature branch"
            git push origin "HEAD:feature/tv-persistent-skip-prompt"
          fi

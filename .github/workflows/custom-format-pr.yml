# Temporary development-only formatter: delete this file once PR passes.
# Restricted to a single developer-owned feature branch. No PR-triggered writes.
name: Format feature/companion-play-on-device
on:
  push:
    branches:
      - 'feature/companion-play-on-device'
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'wastingaeons/plezy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.1'
      - name: Format changed Dart files
        shell: bash
        run: |
          dart format \
            lib/models/companion_remote/remote_command.dart \
            lib/screens/main_screen.dart \
            lib/services/companion_remote/companion_remote_play_resolver.dart \
            lib/services/companion_remote/companion_remote_receiver.dart \
            lib/widgets/media_context_menu.dart \
            test/models/companion_remote/remote_command_test.dart \
            test/services/companion_remote/companion_remote_play_resolver_test.dart \
            test/services/companion_remote_receiver_test.dart \
            test/widgets/media_context_menu_gating_test.dart \
            test/widgets/video_controls_quiescence_test.dart
      - name: Commit formatting (temporary CI-assisted tool)
        shell: bash
        run: |
          set -euo pipefail
          git add -- lib/models/companion_remote/remote_command.dart lib/screens/main_screen.dart lib/services/companion_remote/companion_remote_play_resolver.dart lib/services/companion_remote/companion_remote_receiver.dart lib/widgets/media_context_menu.dart test/models/companion_remote/remote_command_test.dart test/services/companion_remote/companion_remote_play_resolver_test.dart test/services/companion_remote_receiver_test.dart test/widgets/media_context_menu_gating_test.dart test/widgets/video_controls_quiescence_test.dart
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: apply Dart 3.47 formatter to feature branch"
            git push origin "HEAD:feature/companion-play-on-device"
          fi
